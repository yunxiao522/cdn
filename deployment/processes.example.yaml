# Process topology intent only; this is not a service-manager configuration.
node:
  mode: single-node
  state_dir: ./run
  log_dir: ./logs

processes:
  - role: ingest
    instances_per_source: 1
    source_assignment: explicit
  - role: process
    instances: 2
    requires_shared_work_queue: true
  - role: output
    instances_per_destination: 1

operations:
  restart_on_failure: true
  graceful_shutdown_seconds: 30
