# Illustrative source definitions. All sources are disabled until implemented
# and explicitly enabled in a deployment configuration.
sources:
  http_api:
    type: http
    enabled: false
    endpoint: https://example.invalid/events
    poll_interval_seconds: 5
    request_timeout_seconds: 10
    pagination:
      mode: cursor
      cursor_parameter: TBD
      next_cursor_response_path: TBD
      page_size: TBD
    retry:
      max_attempts: TBD
      respect_retry_after: true
    headers:
      Authorization: "${HTTP_API_TOKEN}"

  kafka_events:
    type: kafka
    enabled: false
    brokers:
      - broker-1.example.invalid:9092
      - broker-2.example.invalid:9092
    topics:
      - events
    consumer_group: distributed-events
    auto_commit: false
    commit_after_durable_publish: true
    max_in_flight_per_partition: TBD
    offset_reset: earliest

  mqtt_events:
    type: mqtt
    enabled: false
    broker_url: mqtt://mqtt.example.invalid:1883
    client_id_prefix: distributed-events
    topics:
      - events/#
    shared_subscription: "$share/distributed-events/events/#"
    qos: 1
    acknowledgement: after_durable_publish
    session_expiry_seconds: TBD

  file_events:
    type: file
    enabled: false
    shared_storage_uri: storage://example.invalid/events/
    pattern: "*.jsonl"
    listing_interval_seconds: 5
    distributed_claims: true
    claim_lease_seconds: TBD
    claim_fencing_required: true
    completion_manifest_required: true
    archive_processed: true
