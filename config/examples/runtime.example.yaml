# Illustrative cluster settings. Replica counts and limits are examples only,
# not capacity or availability targets. Values are not consumed by an
# executable service in this repository.
runtime:
  cluster_id: example-stream-cluster
  shutdown_grace_period_seconds: 30

control_plane:
  endpoint: https://control.example.invalid

shared_services:
  message_bus_endpoint: https://broker.example.invalid
  state_store_endpoint: https://state.example.invalid
  checkpoint_store_endpoint: https://checkpoint.example.invalid

worker_groups:
  ingest:
    replicas: 2
  compute:
    replicas: 3
    max_in_flight_per_worker: 1000
  egress:
    replicas: 2
