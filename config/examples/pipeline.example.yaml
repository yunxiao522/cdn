# Illustrative pipeline routing. Transformation behavior must be implemented
# by the selected runtime.
pipeline:
  input_sources:
    - http_api
    - kafka_events
    - mqtt_events
    - file_events
  processing:
    max_in_flight: 1000
    on_error: stop_and_report
    partition_key: event_id
  outputs:
    - id: shared_results
      type: shared_storage
      enabled: false
      uri: storage://example.invalid/output/events/
      format: jsonl
